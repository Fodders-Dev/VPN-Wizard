<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Fodder VPN">
  <!-- Запасная эмблема на случай, если настоящий маскот ещё не загружен.
       Это осознанный знак в той же палитре, а не плохо нарисованный тюлень:
       шляпа звездочёта над щитом, циановые линии созвездия. -->
  <defs>
    <clipPath id="crest-round"><circle cx="48" cy="48" r="48"/></clipPath>
  </defs>
  <g clip-path="url(#crest-round)">
    <rect width="96" height="96" fill="#071827"/>
    <g stroke="#28C7E4" stroke-width="1" opacity=".45" fill="none">
      <path d="M8 22 L24 14 L34 26"/>
      <path d="M62 12 L78 20 L88 12"/>
      <path d="M10 74 L22 84 L38 80"/>
      <path d="M60 86 L74 78 L88 84"/>
    </g>
    <g fill="#28C7E4" opacity=".8">
      <circle cx="8" cy="22" r="1.4"/><circle cx="24" cy="14" r="1.6"/><circle cx="34" cy="26" r="1.2"/>
      <circle cx="62" cy="12" r="1.2"/><circle cx="78" cy="20" r="1.6"/><circle cx="88" cy="12" r="1.2"/>
      <circle cx="10" cy="74" r="1.2"/><circle cx="22" cy="84" r="1.5"/><circle cx="38" cy="80" r="1.2"/>
      <circle cx="60" cy="86" r="1.2"/><circle cx="74" cy="78" r="1.5"/><circle cx="88" cy="84" r="1.2"/>
    </g>

    <!-- щит -->
    <path d="M48 40 L70 47 v13c0 12-9 20-22 25-13-5-22-13-22-25V47z" fill="#102A3B" stroke="#E3AE43" stroke-width="2"/>
    <path d="M40 62 l6 6 12-13" fill="none" stroke="#28C7E4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- шляпа звездочёта -->
    <path d="M48 6 C43 18 36 28 28 34 h40 C60 28 53 18 48 6z" fill="#1B3A63" stroke="#E3AE43" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M24 34 h48 a3 3 0 0 1 0 7 H24 a3 3 0 0 1 0-7z" fill="#16304F" stroke="#E3AE43" stroke-width="1.8"/>
    <g fill="#E3AE43">
      <path d="M44 16 l1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4z"/>
      <circle cx="52" cy="26" r="1.6"/>
      <circle cx="40" cy="28" r="1.2"/>
    </g>
  </g>
</svg>
